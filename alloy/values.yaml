alloy:
  clustering:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  serviceAccount:
    create: true
    name: ""

  # RBAC configuration to allow pod discovery
  rbac:
    create: true

  configMap:
    content: |
      // Kubernetes service discovery for pods in tns-cloud namespace
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["tns-cloud"]
        }
      }

      // Relabel pods to extract metrics endpoints
      discovery.relabel "pod_relabel" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_label_name"]
          regex = ""
          action = "drop"
        }
        rule {
            source_labels = ["__meta_kubernetes_pod_container_port_name"]
            regex = ".*-metrics"
            action = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex = "Succeeded|Failed"
          action = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex = "false"
          action = "drop"
        }

        // Add pod metadata as labels
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_name"]
          replacement = "$1"
          separator = "/"
          action = "replace"
          target_label = "job"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }
      }

      // Scrape metrics from discovered targets
      prometheus.scrape "kubernetes_pods" {
        targets    = discovery.relabel.pod_relabel.output
        forward_to = [prometheus.remote_write.tns_mimir.receiver]

        scrape_interval = "15s"
        scrape_timeout  = "10s"
      }

      // Remote write to Mimir
      prometheus.remote_write "tns_mimir" {
        endpoint {
          url = "http://mmr-mimir-nginx.tns-mimir-1.svc.cluster.local/api/v1/push"
          headers = {
            "X-Scope-OrgID" = "1",
          }
          send_native_histograms = true
        }
        external_labels = {
          cluster = "local-1",
        }
      }

  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472

# Service configuration
service:
  enabled: true
  type: ClusterIP
  port: 12345

# ServiceMonitor for monitoring Alloy itself (optional)
serviceMonitor:
  enabled: false
  interval: 30s

# Node selector and tolerations (optional)
nodeSelector: {}
tolerations: []
affinity: {}
